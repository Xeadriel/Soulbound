<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img"><title>Severed concept sketch</title><desc>A humanoid Severed seen from the front: the left half is living skin with a normal eye, the right half is dead, dark grey-blue with a hollow eye socket, bare cheekbone, ribs and bony fingers. A semi-translucent purple veil covers the head and body, and its end flutters out to the right like a tail. A smaller copy at roughly sprite size sits at the bottom right.</desc>
